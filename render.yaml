# Backend (API + WebSocket) for the Vercel site. Render: New > Blueprint > pick this repo.
# Data lives in PostgreSQL (Neon): create a project at neon.tech and paste its connection string as DATABASE_URL.
# No disk is needed. (The free Render plan "sleeps" when idle, which interrupts running games: use starter.)
services:
  - type: web
    name: yerevanpoly-api
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false      # Neon connection string
      - key: ALLOWED_ORIGIN
        sync: false      # your Vercel address, e.g. https://monopoly.example.am
